<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="256" cy="256" r="220" stroke="url(#logo-grad)" stroke-width="16" fill="none" opacity="0.9" filter="url(#glow)"/>

  <!-- Chart Bar 1 (Shortest) -->
  <rect x="180" y="240" width="36" height="120" rx="8" fill="url(#logo-grad)" />

  <!-- Chart Bar 2 (Medium) -->
  <rect x="238" y="190" width="36" height="170" rx="8" fill="url(#logo-grad)" />

  <!-- Chart Bar 3 (Tallest) -->
  <rect x="296" y="140" width="36" height="220" rx="8" fill="url(#logo-grad)" />

  <!-- Uptrend Arrow Line -->
  <path d="M 140 340 C 200 300, 230 320, 270 270 L 375 165" stroke="url(#logo-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow Head -->
  <path d="M 320 160 L 390 150 L 380 220 Z" fill="url(#logo-grad)" stroke-linejoin="round"/>
</svg>
